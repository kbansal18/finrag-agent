# What the system knows about. Edit, then run `make data`.
#
# Fiscal years are labelled by the calendar year in which the fiscal period ENDS.
# Most companies here end in Dec/Sep/Jun, so the label matches their own naming.
# Retailers are the exception: Walmart's year ending Jan 2025 is "2025" here (Walmart
# also calls it FY2025), but Target calls its year ending Feb 2025 "fiscal 2024".
# Keeping one rule for everyone is deliberate; the eval set tests this edge case.

form_type: 10-K

# Full 10-K text is indexed for these years (the RAG corpus).
fiscal_years: [2024, 2025]

# Structured XBRL metrics go back further, so the agent can answer trend questions
# with SQL even where we have no filing text.
financials_years: [2021, 2022, 2023, 2024, 2025]

companies:
  - {ticker: AAPL,  sector: Technology}
  - {ticker: MSFT,  sector: Technology}
  - {ticker: NVDA,  sector: Technology}
  - {ticker: GOOGL, sector: Technology}
  - {ticker: JPM,   sector: Financials}
  - {ticker: BAC,   sector: Financials}
  - {ticker: GS,    sector: Financials}
  - {ticker: WMT,   sector: Retail}
  - {ticker: COST,  sector: Retail}
  - {ticker: TGT,   sector: Retail}
