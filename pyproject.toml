[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finrag"
version = "0.1.0"
description = "Agentic RAG over SEC 10-K filings, with a reproducible evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
# Dependencies are added only when a module actually uses them.
dependencies = [
  "beautifulsoup4>=4.12",
  "fastembed>=0.4",
  "lxml>=5.0",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "requests>=2.32",
  "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
finrag-download = "finrag.ingest.edgar:main"
finrag-financials = "finrag.ingest.xbrl:main"
finrag-parse = "finrag.ingest.parse:main"
finrag-index = "finrag.retrieval.index:main"
finrag-search = "finrag.retrieval.retriever:main"
finrag-eval-check = "finrag.eval.dataset:main"
finrag-eval-retrieval = "finrag.eval.retrieval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
